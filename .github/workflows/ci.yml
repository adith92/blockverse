name: BLOCKVERSE quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No lockfile exported by Gemini; install (not ci) pending first online lock generation.
      - run: npm install --no-fund
      - run: npm run test:unit
      - run: npm run build
      - run: node --test server/tests/validation.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: blockverse-dist
          path: dist/
  firestore-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund
      - run: npm run test:rules:emulator

  vps-server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
